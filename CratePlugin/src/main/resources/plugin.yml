name: CratePlugin
version: 1.0.0
main: ru.essde.crate.CratePlugin
api-version: '1.21'
author: essde
description: Configurable timed barrel crates

commands:
  crate:
    description: Opens the crate editor or manages placed crates
    usage: /crate <editor|list|remove>
    permission: crate.admin
  crate_create:
    description: Turns the barrel you are looking at into a timed crate
    usage: /crate_create <название>
    permission: crate.admin
  crate_input:
    description: Sets a crate chance or timer value after selecting it in the editor
    usage: /crate_input <число>
    permission: crate.admin

permissions:
  crate.admin:
    description: Allows creating and managing crates
    default: op