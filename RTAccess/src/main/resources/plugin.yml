name: RTAccess
version: 1.0.1
main: ru.essde.rtaccess.RTAccessPlugin
api-version: '1.21.4'
description: RT doors, unbreakable blocks and private regions for Paper 1.21.4
author: essde342-bit

commands:
  rtaccess:
    description: Управление дверями РТ и ключ-картами
    usage: /rtaccess <give|removedoor|reload>
    aliases: [rt]
    permission: rtaccess.admin
  rt_block:
    description: Пометить блок в руке для защиты каждого установленного экземпляра
    usage: /rt_block [unmark|list]
    aliases: [rtblock]
    permission: rtaccess.admin
  rt_private:
    description: Выделение и создание защищённых зон RT Private
    usage: /rt_private <wand|pos1|pos2|create|delete|list|info|clear>
    aliases: [rtprivate]
    permission: rtaccess.admin

permissions:
  rtaccess.admin:
    description: Управление RTAccess, блоками и приватами
    default: op
