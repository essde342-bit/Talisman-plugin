name: RTAccess
version: 1.0.0
main: ru.essde.rtaccess.RTAccessPlugin
api-version: '1.21.4'
description: Custom RT doors opened with reusable blue keycards
author: essde342-bit

commands:
  rtaccess:
    description: Управление дверями РТ и ключ-картами
    usage: /rtaccess <give|removedoor|reload>
    aliases: [rt]
    permission: rtaccess.admin

permissions:
  rtaccess.admin:
    description: Выдача предметов и управление дверями РТ
    default: op
