name: Build Paper plugins

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build all plugins with Maven
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Package RustWeapons resource pack
        run: |
          mkdir -p RustWeapons/target
          cd RustWeapons/resource-pack
          zip -qr ../target/RustWeapons-ResourcePack.zip .

      - name: Upload TalismanPlugin
        uses: actions/upload-artifact@v4
        with:
          name: TalismanPlugin-1.0.0
          path: TalismanPlugin/target/TalismanPlugin-1.0.0.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload CombatSystem
        uses: actions/upload-artifact@v4
        with:
          name: CombatSystem-1.0.0
          path: CombatSystem/target/CombatSystem-1.0.0.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload RTAccess
        uses: actions/upload-artifact@v4
        with:
          name: RTAccess-1.0.0
          path: RTAccess/target/RTAccess-1.0.0.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload CorpsePlugin
        uses: actions/upload-artifact@v4
        with:
          name: CorpsePlugin-1.0.0
          path: CorpsePlugin/target/CorpsePlugin-1.0.0.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload CratePlugin
        uses: actions/upload-artifact@v4
        with:
          name: CratePlugin-1.0.0
          path: CratePlugin/target/CratePlugin-1.0.0.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload RTMap
        uses: actions/upload-artifact@v4
        with:
          name: RTMap-1.0.0
          path: RTMap/target/RTMap-1.0.0.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload RustWeapons
        uses: actions/upload-artifact@v4
        with:
          name: RustWeapons-1.0.0
          path: RustWeapons/target/RustWeapons-1.0.0.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload RustWeapons Resource Pack
        uses: actions/upload-artifact@v4
        with:
          name: RustWeapons-ResourcePack
          path: RustWeapons/target/RustWeapons-ResourcePack.zip
          if-no-files-found: error
          retention-days: 30
