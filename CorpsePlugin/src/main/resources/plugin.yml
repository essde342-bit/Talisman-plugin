name: CorpsePlugin
version: 1.0.0
main: ru.essde.corpse.CorpsePlugin
api-version: '1.21.4'
description: Horizontal player corpses with persistent shared loot inventories
author: essde342-bit
depend:
  - packetevents

commands:
  corpses:
    description: Управление системой трупов
    usage: /corpses <list|reload|clear>
    permission: corpse.admin

permissions:
  corpse.admin:
    description: Управление CorpsePlugin
    default: op
